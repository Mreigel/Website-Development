{% extends "base.html" %}
{% block title %}Start a Project Inquiry{% endblock %}

{% block content %}
<section class="form-section">
  <h1>Tell Us About Your Project</h1>
  <form method="POST" action="{{ url_for('routes.inquiry') }}" class="inquiry-form" id="multiStepForm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <!-- Step 1: Project Info -->
    <div class="form-step active">
      <label for="title">Project Title:</label>
      <input type="text" name="title" placeholder="e.g., Portfolio Website, E-Commerce Store" required>

      <label for="description">Describe Your Project:</label>
      <textarea name="description" rows="6" placeholder="Share your idea, features, or main points." required></textarea>

      <label for="goals">Main Goals or Features (optional):</label>
      <textarea name="goals" rows="4" placeholder="e.g., user login, admin panel, real-time chat, mobile-friendly design"></textarea>

      <label for="budget">Estimated Budget Range:</label>
      <select name="budget" required>
        <option value="starter">Just getting started (under $1k)</option>
        <option value="small">Small project ($1k–$3k)</option>
        <option value="mid">Custom build ($3k–$7k)</option>
        <option value="large">Full-featured site ($7k+)</option>
      </select>

      <label for="timeline">Timeline or Deadline:</label>
      <input type="text" name="timeline" placeholder="e.g., ASAP, 2 months, by October 1st" required>

      <label for="referral">How Did You Hear About Us?</label>
      <select name="referral">
        <option value="" disabled selected>Select one</option>
        <option value="google">Google Search</option>
        <option value="social">Social Media</option>
        <option value="referral">Referred by a friend</option>
        <option value="returning">I’m a returning client</option>
        <option value="other">Other</option>
      </select>

      <label for="start_readiness">Are You Ready to Start?</label>
      <select name="start_readiness" required>
        <option value="" disabled selected>Select one</option>
        <option value="yes">Yes – I'm ready to get started</option>
        <option value="soon">Soon – within the next month</option>
        <option value="exploring">Just exploring ideas</option>
      </select>
    </div>

    <!-- Step 2: Contact Info -->
    <div class="form-step">
      <label for="name">Your Full Name:</label>
      <input type="text" name="name" required>

      <label for="email">Email Address:</label>
      <input type="email" name="email" required>

      <label for="phone">Phone Number (optional):</label>
      <input type="tel" name="phone">

      <label for="company">Company / Org Name (optional):</label>
      <input type="text" name="company">

      <label for="contact_method">Preferred Contact Method:</label>
      <select name="contact_method">
        <option value="email">Email</option>
        <option value="phone">Phone</option>
        <option value="text">Text</option>
      </select>

      <label>
        <input type="checkbox" name="nda"> I’d like to discuss under NDA
      </label>

      <label for="token">Verification Code (optional):</label>
      <input type="text" name="token" placeholder="If referred or pre-verified">
    </div>

    <!-- Navigation Buttons -->
    <div class="form-nav">
      <button type="button" id="prevBtn">Back</button>
      <button type="button" id="nextBtn">Next</button>
      <button type="submit" id="submitBtn" style="display: none;">Submit Inquiry</button>
    </div>

  </form>
</section>

<script>
  const steps = document.querySelectorAll(".form-step");
  const nextBtn = document.getElementById("nextBtn");
  const prevBtn = document.getElementById("prevBtn");
  const submitBtn = document.getElementById("submitBtn");
  let currentStep = 0;

  function showStep(index) {
    steps.forEach((step, i) => {
      step.style.display = i === index ? "block" : "none";
    });

    prevBtn.style.display = index > 0 ? "inline-block" : "none";
    nextBtn.style.display = index < steps.length - 1 ? "inline-block" : "none";
    submitBtn.style.display = index === steps.length - 1 ? "inline-block" : "none";
  }

  nextBtn.addEventListener("click", () => {
    if (currentStep < steps.length - 1) {
      currentStep++;
      showStep(currentStep);
    }
  });

  prevBtn.addEventListener("click", () => {
    if (currentStep > 0) {
      currentStep--;
      showStep(currentStep);
    }
  });

  showStep(currentStep);
</script>
{% endblock %}
